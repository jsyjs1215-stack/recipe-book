async function geoPhoton(q){
  const r=await fetch('https://photon.komoot.io/api/?limit=6&q='+encodeURIComponent(q));if(!r.ok) return [];
  return ((await r.json()).features||[]).map(f=>({lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],...f.properties})).filter(f=>f.lat>33&&f.lat<39&&f.lng>124&&f.lng<132);

async function geocodePlace(p){
  const q=placeGeoQ(p);if(!q) return null;
  const a=addrParts(p.address||''),near=[a.city,a.gu].filter(Boolean).join(' ');
  const pick=(f,acc)=>({lat:+f.lat.toFixed(6),lng:+f.lng.toFixed(6),acc,q});
  if(p.address){
    // 1) 정확한 건물: 도로명(또는 지번)과 번호가 똑같을 때만
    const ph=await geoPhoton(a.clean);
    const ex=ph.find(f=>f.housenumber===a.no&&((a.road&&f.street===a.road)||(!a.road&&a.lot&&f.locality===a.lot)));
    if(ex) return pick(ex,'exact');
    const n=await geoNominatim(a.clean);
    if(n&&/building|house|amenity|shop|office|tourism|leisure/.test(n.type)&&(!a.road||n.disp.includes(a.road))) return pick(n,'exact');
    // 2) 길: 그 길의 위치
    if(a.road){
      for(const rd of [a.road,a.road.replace(/\d+번?길$/,'')].filter((x,i,arr)=>x&&arr.indexOf(x)===i)){
        const st=(await geoPhoton((near+' '+rd).trim())).find(f=>f.name===rd&&(f.type==='street'||f.osm_key==='highway')&&sameTop(f,a.top));
        if(st) return pick(st,rd===a.road?'street':'area');
      }
      if(n&&n.type==='road'&&n.disp.includes(a.road)) return pick(n,'street');
    }
  }
  // 3) 동네: 동 이름이 정확히 맞는 곳(시·도까지 같아야 함). 시 전체 같은 너무 넓은 곳에는 핀을 꽂지 않음
  const rg=String(p.region||'').split(/\s+/).filter(Boolean),top=a.top||(rg[0]||'').replace(/(특별자치|특별|광역)?(시|도)$/,'');
  const words=[a.lot,...rg.slice(1).reverse()].filter(w=>w&&w.length>=2&&!/(시|도)$/.test(w)&&w!==top);
  const base=near||rg.slice(0,2).join(' ');
  for(const w of [...new Set(words)]){
    const ar=(await geoPhoton((base+' '+w).trim()))
      .find(f=>String(f.name||'').replace(/(동|구)$/,'')===w.replace(/(동|구)$/,'')&&/locality|district|other/.test(f.type||'')&&sameTop(f,top));
    if(ar) return pick(ar,'area');
  }
  return null;
}

  const cand=j.candidates&&j.candidates[0];

  const d=extractJson(text)||{};
  const searched=!!(cand&&cand.groundingMetadata&&((cand.groundingMetadata.groundingChunks||[]).length||(cand.groundingMetadata.webSearchQueries||[]).length));
  const addr=String(d.address||'').trim();
  // 실제로 검색을 했고 주소가 주소처럼 생겼을 때만 저장
  if(!searched||d.confident===false||!/[시군구]|[로길]\s?\d|[동읍면리]/.test(addr)||addr.length<6) return false;
  p.address=addr.slice(0,120);p.addrSource='search';
  if(d.region&&String(d.region).length>(p.region||'').length) p.region=String(d.region).slice(0,40);
  if(!p.hours&&d.hours) p.hours=String(d.hours).slice(0,80);
  touchP(p);
  return true;
}

  return {naver:'https://map.naver.com/p/search/'+encodeURIComponent(q2||q),kakao:'https://map.kakao.com/?q='+encodeURIComponent(q2||q),q};
}

function applyTheme(){const t=settings.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}

/* ───────── 공통 ───────── */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

/* ───────── 온라인 저장 (Firebase Realtime Database, REST) ─────────
   - 레시피마다 따로 저장: {주소}/recipebook/{내 코드}/recipes/{id}
   - 고칠 때마다 updatedAt(기기 시각)을 붙이고, 두 기기가 같은 레시피를 고치면 더 나중에 고친 쪽이 이김
   - 지운 레시피는 {deleted:true}로 남겨서 다른 기기에서 되살아나지 않게 함
   - 서버 쪽 srvAt(서버 시각)으로 "지난번 이후 바뀐 것만" 받아 옴. rev 값만 자주 확인해서 데이터 사용량을 아낌 */
const LS_SYNC='recipebook.sync.v1';
let sync=Object.assign({url:'',code:'',dirty:{},since:0,pdirty:{},sinceP:0,rev:0,lastOk:0,setAt:0},load(LS_SYNC,{}));
/* 같은 방식으로 맞추는 두 묶음: 레시피(recipes), 맛집(places) */
const COLLS=[
  {path:'/recipes',dirty:'dirty',since:'since',get:()=>recipes,arrays:['ingredients','steps','tips','tags','cooked']},
  {path:'/places',dirty:'pdirty',since:'sinceP',get:()=>places,arrays:['menu','tips','tags','visited']}];
/* Firebase는 빈 목록을 저장하지 않고, 경우에 따라 목록을 {0:..,1:..} 모양으로 돌려줌 → 항상 배열로 고쳐 둠 */
function fixArrays(o,fields){
  if(!o||typeof o!=='object') return o;
  fields.forEach(f=>{const v=o[f];
    if(v==null) o[f]=[];
    else if(!Array.isArray(v)&&typeof v==='object') o[f]=Object.keys(v).sort((a,b)=>a-b).map(k=>v[k]).filter(x=>x!=null);
  });
  return o;
}
let syncState={busy:false,err:'',online:true};
const isConnected=()=>!!(sync.url&&sync.code);
function saveSync(){save(LS_SYNC,sync)}
function fbPath(p){return sync.url.replace(/\/+$/,'')+'/recipebook/'+encodeURIComponent(sync.code)+p}
async function fb(method,p,body,q=''){
  const r=await fetch(fbPath(p)+'.json'+(q?'?'+q:''),{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  if(!r.ok){const t=await r.text().catch(()=>'');const e=new Error('FB '+r.status+' '+t.slice(0,120));e.status=r.status;throw e}
  return method==='GET'?r.json():null;
}
/* 레시피를 고칠 때 부르는 함수 */
function touch(r){r.updatedAt=Date.now();sync.dirty[r.id]=r.updatedAt;saveSync();persist();schedulePush()}
function tombstone(id){sync.dirty[id]=-Date.now();saveSync();persist();schedulePush()}
/* 맛집을 고칠 때 */
function touchP(p){p.updatedAt=Date.now();sync.pdirty[p.id]=p.updatedAt;saveSync();persist();schedulePush()}
function tombstoneP(id){sync.pdirty[id]=-Date.now();saveSync();persist();schedulePush()}
let pushTimer=null;
function schedulePush(){if(!isConnected())return;clearTimeout(pushTimer);pushTimer=setTimeout(()=>syncNow(),800);updateCloud()}

async function pushDirty(){
  let pushed=false;
  for(const C of COLLS){
    const dirty=sync[C.dirty]||(sync[C.dirty]={});
    const ids=Object.keys(dirty).filter(id=>id!=='sample');
    if(!ids.length) continue;
    pushed=true;
    for(let i=0;i<ids.length;i+=20){ // 사진이 든 항목이 많을 수 있어 20개씩 나눠 보냄
      const part=ids.slice(i,i+20),body={},snap={};
      part.forEach(id=>{
        const mark=dirty[id];snap[id]=mark;
        const r=C.get().find(x=>x.id===id);
        body[id]=(mark<0||!r)?{deleted:true,updatedAt:Math.abs(mark)||Date.now(),srvAt:{'.sv':'timestamp'}}
          :Object.assign({},r,{srvAt:{'.sv':'timestamp'}});
      });
      await fb('PATCH',C.path,body,'print=silent');
      part.forEach(id=>{if(dirty[id]===snap[id]) delete dirty[id]}); // 보내는 사이 또 고쳤으면 다음에 다시 보냄
      saveSync();
    }
  }
  return pushed;
}
async function pullChanges(force){
  const rev=await fb('GET','/rev');
  if(!force&&rev&&rev===sync.rev) return false;
  let changed=false;
  for(const C of COLLS){
    const since=sync[C.since]||0,dirty=sync[C.dirty]||{},list=C.get();
    let data;
    try{data=await fb('GET',C.path,null,since?'orderBy=%22srvAt%22&startAt='+(since+1):'')}
    catch(e){if(e.status===400) data=await fb('GET',C.path);else throw e} // 규칙에 indexOn이 없으면 전체 받기
    let maxSrv=since;
    Object.entries(data||{}).forEach(([id,rem])=>{
      if(!rem||typeof rem!=='object') return;
      if(rem.srvAt>maxSrv) maxSrv=rem.srvAt;
      if(dirty[id]&&Math.abs(dirty[id])>=(rem.updatedAt||0)) return; // 이 기기에서 더 최근에 고친 것
      const i=list.findIndex(x=>x.id===id),loc=list[i];
      if(rem.deleted){if(loc&&(loc.updatedAt||0)<=rem.updatedAt){list.splice(i,1);changed=true}return}
      if(!loc){const r=fixArrays(Object.assign({},rem),C.arrays);delete r.srvAt;list.push(r);changed=true;return}
      if((rem.updatedAt||0)>(loc.updatedAt||0)){const r=fixArrays(Object.assign({},rem),C.arrays);delete r.srvAt;list[i]=r;delete cook[id];changed=true}
    });
    sync[C.since]=maxSrv;
  }
  sync.rev=rev||sync.rev;
  // 설정(API 키·모델)도 함께: 더 최근에 바꾼 쪽을 따름
  const st=await fb('GET','/settings');
  if(st&&st.setAt>(sync.setAt||0)){settings.apiKey=st.apiKey||settings.apiKey;settings.model=st.model||settings.model;
    // 냉장고 재료도 함께(빈 목록은 Firebase에 안 남으니 없으면 빈 것)
    if('fridgeAt' in st){settings.fridge=Array.isArray(st.fridge)?st.fridge:Object.values(st.fridge||{});settings.staples=st.staples!==false;
      settings.fridgeExp=(Array.isArray(st.fridgeExp)?st.fridgeExp:Object.values(st.fridgeExp||{})).filter(x=>x&&x.n&&x.d);
      settings.fridgeQty=(Array.isArray(st.fridgeQty)?st.fridgeQty:Object.values(st.fridgeQty||{})).filter(x=>x&&x.n&&x.q);
      settings.placeDupIgnore=(Array.isArray(st.placeDupIgnore)?st.placeDupIgnore:Object.values(st.placeDupIgnore||{})).filter(x=>typeof x==='string');
      settings.fridgeDupIgnore=(Array.isArray(st.fridgeDupIgnore)?st.fridgeDupIgnore:Object.values(st.fridgeDupIgnore||{})).filter(x=>typeof x==='string');
      settings.fridgeAlias=(Array.isArray(st.fridgeAlias)?st.fridgeAlias:Object.values(st.fridgeAlias||{})).filter(x=>x&&x.n&&x.b);
      settings.fridgePic=(Array.isArray(st.fridgePic)?st.fridgePic:Object.values(st.fridgePic||{})).filter(x=>x&&x.n&&x.p);
      settings.dupIgnore=(Array.isArray(st.dupIgnore)?st.dupIgnore:Object.values(st.dupIgnore||{})).filter(x=>typeof x==='string');
      fhReset();settings.fridgeCat=(Array.isArray(st.fridgeCat)?st.fridgeCat:Object.values(st.fridgeCat||{})).filter(x=>x&&x.n&&x.c);
      settings.cookLog=(Array.isArray(st.cookLog)?st.cookLog:Object.values(st.cookLog||{})).filter(x=>x&&x.id).map(x=>({...x,used:(Array.isArray(x.used)?x.used:Object.values(x.used||{})).map(u=>({q:'',d:'',...u}))}))}
    save(LS_SET,settings);sync.setAt=st.setAt;if(view.name==='fridge')keepScroll(renderFridge)}
  saveSync();
  if(changed){persist();refreshView()}
  return changed;
}
async function pushSettings(){
  sync.setAt=Date.now();saveSync();
  if(isConnected()) try{
    await fb('PUT','/settings',{apiKey:settings.apiKey,model:settings.model,fridge:settings.fridge||[],fridgeExp:settings.fridgeExp||[],fridgeQty:settings.fridgeQty||[],fridgeCat:settings.fridgeCat||[],dupIgnore:settings.dupIgnore||[],fridgeAlias:settings.fridgeAlias||[],fridgeDupIgnore:settings.fridgeDupIgnore||[],placeDupIgnore:settings.placeDupIgnore||[],fridgePic:settings.fridgePic||[],cookLog:settings.cookLog||[],staples:settings.staples!==false,fridgeAt:sync.setAt,setAt:sync.setAt},'print=silent');
    await fb('PUT','/rev',{'.sv':'timestamp'},'print=silent'); // 다른 기기가 바뀐 걸 알아채도록
  }catch(e){}
}
let syncAgain=false;
async function syncNow(force){
  if(!isConnected()) return;
  if(syncState.busy){syncAgain=true;return}
  syncState.busy=true;updateCloud();
  try{
    const pushed=await pushDirty();
    if(pushed) await fb('PUT','/rev',{'.sv':'timestamp'},'print=silent');
    await pullChanges(force);
    syncState.err='';syncState.online=true;sync.lastOk=Date.now();saveSync();
  }catch(e){
    syncState.online=false;
    syncState.err=e.status===401||e.status===403?'Firebase 규칙에서 recipebook 저장이 허용되어 있지 않아요. 설정 화면의 안내대로 규칙을 확인해 주세요.'
      :e.status===404?'Firebase 주소가 맞지 않아요. 주소를 다시 확인해 주세요.'
      :e.status?'온라인 저장 오류 ('+e.status+')':'인터넷에 연결되지 않아 이 기기에만 저장해 두었어요. 연결되면 자동으로 올라가요.';
  }finally{
    syncState.busy=false;updateCloud();
    if(view.name==='settings') renderSyncBox();
    if(syncAgain){syncAgain=false;setTimeout(()=>syncNow(),300)}
  }
}
function refreshView(){
  if(view.name==='list'||view.name==='folder') renderList();
  else if(view.name==='detail'){if(recipes.some(x=>x.id===view.id)) keepScroll(renderDetail); else go({name:'list'},false)}
  else if(view.name==='dups') keepScroll(renderDups);
  else if(view.name==='pmap'&&!pmapState.busy&&!pmapState.fix) renderPlaceMap(); // 다른 기기에서 별점·위치를 바꿨을 때
  else if(view.name==='places') keepScroll(renderPlaces);
  else if(view.name==='place'){if(places.some(x=>x.id===view.id)) keepScroll(renderPlace); else go({name:'places'},false)}
}
function updateCloud(){
  const b=document.getElementById('cloudBtn');if(!b)return;
  b.hidden=!isConnected();
  const pending=Object.keys(sync.dirty).filter(id=>id!=='sample').length+Object.keys(sync.pdirty||{}).length;
  b.dataset.state=syncState.busy?'busy':(!syncState.online||syncState.err)?'err':pending?'wait':'ok';
  b.setAttribute('aria-label',b.dataset.state==='ok'?'온라인에 저장됨':b.dataset.state==='busy'?'온라인과 맞추는 중':b.dataset.state==='wait'?'올릴 레시피 '+pending+'개 대기 중':'온라인 저장 안 됨');
  b.title=b.getAttribute('aria-label');
}
/* 연결 코드: 다른 기기에 한 번 붙여넣으면 같은 레시피북에 연결됨 */
function makeLinkCode(){return 'RB-'+btoa(unescape(encodeURIComponent(JSON.stringify({u:sync.url,k:sync.code})))).replace(/=+$/,'')}
function parseLinkCode(s){
  try{const t=s.trim().replace(/^RB-/,'');const j=JSON.parse(decodeURIComponent(escape(atob(t+'==='.slice((t.length+3)%4)))));
    return j&&j.u&&j.k?j:null}catch(e){return null}
}
function newSecret(){const a=new Uint8Array(15);crypto.getRandomValues(a);return Array.from(a,b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('')}
function normFbUrl(s){
  s=(s||'').trim();if(!s)return '';
  if(!/^https?:\/\//.test(s)) s='https://'+s;
  try{const u=new URL(s);if(!/firebaseio\.com$|firebasedatabase\.app$/.test(u.hostname))return '';return u.origin+'/'}catch(e){return ''}
}
function markAllDirty(){
  recipes.forEach(r=>{if(r.id!=='sample'){r.updatedAt=r.updatedAt||r.createdAt||Date.now();sync.dirty[r.id]=r.updatedAt}});
  places.forEach(p=>{p.updatedAt=p.updatedAt||p.createdAt||Date.now();sync.pdirty[p.id]=p.updatedAt});
}
async function connectNew(url){
  sync=Object.assign(sync,{url,code:newSecret(),since:0,sinceP:0,rev:0,dirty:{},pdirty:{}});
  markAllDirty();
  saveSync();
  await fb('GET','/rev'); // 권한 확인
  await pushSettings();
  await syncNow(true);
}
async function connectExisting(j){
  sync=Object.assign(sync,{url:j.u,code:j.k,since:0,sinceP:0,rev:0,dirty:{},pdirty:{},setAt:0});
  // 이 기기에만 있던 레시피·맛집도 함께 올림
  markAllDirty();
  saveSync();
  await fb('GET','/rev');
  await syncNow(true);
  // 온라인 레시피를 받았으면 예시 레시피는 정리
  if(recipes.some(r=>r.id!=='sample')){recipes=recipes.filter(r=>r.id!=='sample');persist();refreshView()}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') syncNow();
  else saveNow();
});
window.addEventListener('online',()=>syncNow());
setInterval(()=>{if(document.visibilityState==='visible')syncNow()},30000);

document.getElementById('homeTitle').onclick=()=>go({name:'list'});
document.getElementById('backBtn').onclick=()=>history.length>1?history.back():go({name:'list'});
document.getElementById('setBtn').onclick=()=>go({name:'settings'});
document.getElementById('cloudBtn').onclick=()=>{toast(document.getElementById('cloudBtn').title);syncNow()};
document.getElementById('fab').onclick=e=>{
  const b=e.target.closest('[data-tab]');if(!b)return;
  const t=b.dataset.tab;filter.tag='';filter.q='';
  if(t==='home')go({name:'list'});
  else if(t==='all')go({name:'folder',f:'*'});
  else if(t==='fav')go({name:'folder',f:'★'});
  else if(t==='set')go({name:'settings'});
  else if(t==='fridge')go({name:'fridge'});
  else if(t==='places'){placeFilter={q:'',c:'',rg:'',d:'',sp:''};go({name:'places'})}
  else if(t==='add'){
    // 맛집 화면에서 누르면 맛집 추가, 그 밖에는 레시피 추가 (입력 중인 게 있으면 그대로 둠)
    const want=['places','plist','place'].includes(view.name)?'place':'recipe';
    if(!hasInput()&&!addState.busy) addState=emptyAdd(want);
    go({name:'add'});
  }
};

/* 폰의 "공유하기 → 레시피북"(또는 ?url=...)으로 열리면 바로 분석 시작 */
(async function(){
  await loadRecipes();
  updateCloud();
  if(isConnected()) syncNow();
  const p=new URLSearchParams(location.search);
  const shared=[p.get('url'),p.get('text'),p.get('title')].filter(Boolean).join(' ');
  const m=shared.match(/https?:\/\/[^\s"'<>]+/);
  if(m){
    addState.raw=m[0];
    // 공유 글에 링크 말고 긴 설명이 같이 왔으면 캡션으로 사용
    const rest=shared.replace(m[0],'').trim();
    if(rest.length>60) addState.caption=rest;
    hRep({v:{name:'list'}},location.pathname);go({name:'add'});
    autoStart(); // 저절로 시작하지 않고 사진·영상 칸만 펼침
  }
  else render();
})();

/* 새 버전 자동 반영: 열 때마다 서버의 최신 파일을 받아 버전이 다르면 한 번 새로고침.
   cache:'reload'로 받으면 브라우저 저장본도 새 파일로 바뀌어서 다음 로드부터 새 버전이 나옴 */
(async function(){
  if(!/^https?:$/.test(location.protocol)) return;
  const mine=document.querySelector('meta[name="app-version"]').content;
  try{
    const t=await (await fetch(location.pathname,{cache:'reload'})).text();
    const m=t.match(/name="app-version" content="([^"]+)"/);
    if(!m||m[1]===mine) return;
    let tried='';try{tried=sessionStorage.getItem('rb-upd')||''}catch(e){}
    if(tried===m[1]) return; // 이미 한 번 새로고침했는데도 그대로면 반복하지 않음
    try{sessionStorage.setItem('rb-upd',m[1])}catch(e){}
    if(['list','folder','detail','places','plist','place'].includes(view.name)||(view.name==='add'&&!hasInput())) location.reload();
    else toast('새 버전이 있어요. 지금 작업을 마친 뒤 앱을 다시 열면 반영돼요');
  }catch(e){}
})();
</script>
