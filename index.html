<style>
/* 레이아웃: 상단 바 + 단일 컬럼(최대 720px). 목록은 2열 카드, 상세는 영상 → 재료 → 순서 */
:root{
  --bg:#f7f8f5; --surface:#ffffff; --ink:#1f2622; --muted:#66706a; --line:#dde2dc;
  --accent:#2f4a3a; --accent-ink:#ffffff; --pick:#e2a63b; --pick-soft:#fbefd6; --danger:#b4432f;
  --chip:#e9eee8;
  --display:"Gowun Batang",ui-serif,"Batang",serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141816; --surface:#1c211e; --ink:#e7ece8; --muted:#9aa49e; --line:#2e3631;
  --accent:#8fc0a0; --accent-ink:#10140f; --pick:#e9b65a; --pick-soft:#3a2f18; --danger:#e07a64; --chip:#262d29; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --surface:#1c211e; --ink:#e7ece8; --muted:#9aa49e; --line:#2e3631;
  --accent:#8fc0a0; --accent-ink:#10140f; --pick:#e9b65a; --pick-soft:#3a2f18; --danger:#e07a64; --chip:#262d29; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--pick);outline-offset:2px}

header.bar{position:sticky;top:0;z-index:10;background:var(--accent);color:var(--accent-ink);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.bar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar h1{font:700 21px/1.2 var(--display);margin:0;flex:1;cursor:pointer;letter-spacing:-.01em}
.iconbtn{background:transparent;border:0;color:inherit;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.12)}
.iconbtn svg{width:22px;height:22px}

main{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:16px 120px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%;padding:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 목록 */
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chip{flex:none;border:1px solid transparent;background:var(--chip);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
@media (max-width:440px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0;text-align:left;padding:0}
.card:hover{border-color:var(--accent)}
.thumb{aspect-ratio:4/3;background:var(--chip);position:relative;overflow:hidden;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font:700 34px var(--display);color:var(--muted)}
.badge{position:absolute;left:8px;top:8px;font-size:11px;font-weight:600;letter-spacing:.04em;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:2px 7px}
.star{position:absolute;right:8px;top:6px;color:var(--pick);font-size:18px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.card .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.card .t{font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty h2{font:700 22px var(--display);color:var(--ink);margin:0 0 6px}

.fab{position:fixed;right:max(16px,calc(50vw - 344px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--pick);color:#1f1a10;border:0;border-radius:999px;padding:14px 20px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;gap:6px;z-index:5}

/* 추가 / 폼 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.panel h2{font:700 20px var(--display);margin:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
label.f input,label.f textarea,label.f select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px;width:100%}
label.f textarea{min-height:90px;resize:vertical;line-height:1.55}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.two{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:440px){.two{grid-template-columns:1fr 1fr}}
.photos{display:flex;flex-direction:column;gap:8px}
.ph-h{display:flex;flex-direction:column;gap:2px}
.ph-h .hint{font-size:12.5px;color:var(--muted)}
.ph-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.ph-item{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--chip);max-width:100%}
.ph-item img{width:100%;height:100%;object-fit:cover;object-position:top}
.ph-x{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:16px;line-height:1;cursor:pointer}
.ph-add{border-style:dashed;border-width:1.5px;padding:18px;color:var(--accent);font-weight:600}
label.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
.d-photo{max-width:360px;margin:0 auto;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.d-photo img{width:100%}
details.opt summary{cursor:pointer;font-weight:500;font-size:14px}
details.opt[open] summary{margin-bottom:10px}
.status{border-radius:10px;padding:12px 14px;font-size:14px}
.status.work{background:var(--pick-soft)}
.status.err{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--ink)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* 영상 */
.player{width:100%;max-width:100%;background:#000;border-radius:var(--r);overflow:hidden;margin:0 auto}
.player iframe{width:100%;height:100%;border:0;display:block}
.player.wide{aspect-ratio:16/9}
.player.tall{aspect-ratio:9/16;max-width:360px}
.player.ig{height:620px;max-width:400px;background:var(--surface)}
.panel .player.tall{max-width:min(360px,calc(50vh * 9 / 16))}
.panel .player.ig{height:min(620px,60vh)}
.vlink{font-size:13px;text-align:center;margin:6px 0 0}

/* 상세 */
.d-head{margin:18px 0 10px}
.d-head h2{font:700 26px/1.3 var(--display);margin:0 0 6px;text-wrap:balance}
.d-sum{color:var(--muted);margin:0 0 10px}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.fact{background:var(--chip);border-radius:8px;padding:4px 10px;font-size:13px}
.fact b{font-weight:600}
.sec{margin-top:24px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:6px}
.sec-h h3{font:700 19px var(--display);margin:0}
.scaler{display:flex;align-items:center;gap:4px;font-size:13px;font-variant-numeric:tabular-nums}
.scaler button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.grp{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin:12px 0 2px}
ul.ing{list-style:none;margin:0;padding:0}
ul.ing li{display:flex;align-items:baseline;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--line);cursor:pointer}
ul.ing li .nm{flex:1;min-width:0}
ul.ing li .am{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
ul.ing li .bx,ol.steps li .bx{flex:none;width:18px;height:18px;border:1.5px solid var(--muted);border-radius:5px;position:relative;top:3px}
ul.ing li.done .nm,ul.ing li.done .am{text-decoration:line-through;opacity:.5}
li.done .bx{background:var(--accent);border-color:var(--accent)}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);counter-increment:s}
ol.steps li::before{content:counter(s);flex:none;font:700 20px/1.2 var(--display);color:var(--accent);width:22px}
ol.steps li .tx{flex:1;min-width:0;cursor:pointer}
ol.steps li.done .tx{opacity:.45}
.ts{border:0;background:var(--pick-soft);color:var(--ink);font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;margin-left:6px;cursor:pointer;font-variant-numeric:tabular-nums}
ul.tips{margin:6px 0 0;padding-left:20px}
ul.tips li{margin:4px 0}
.memo{white-space:pre-wrap;background:var(--pick-soft);border-radius:10px;padding:12px 14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}
.ai-note{font-size:12.5px;color:var(--muted);margin-top:16px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--danger) 12%,transparent);border-radius:10px;padding:10px 12px;margin-top:10px}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <button class="iconbtn" id="backBtn" aria-label="뒤로" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>

<script>
'use strict';
/* ───────── 저장소 ───────── */
const LS_RECIPES='recipebook.recipes.v1', LS_SET='recipebook.settings.v1';
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('저장 공간이 부족해 저장하지 못했어요');return false}}

let recipes=load(LS_RECIPES,null);
if(!recipes){recipes=[sampleRecipe()];save(LS_RECIPES,recipes)}
const DEFAULT_MODEL='gemini-3.8-flash';
const MODEL_FALLBACKS=['gemini-3.8-flash','gemini-3.6-flash','gemini-3.5-flash-lite','gemini-flash-latest','gemini-2.5-flash'];
let settings=Object.assign({apiKey:'',model:DEFAULT_MODEL,theme:'auto'},load(LS_SET,{}));
if(settings.model==='gemini-2.5-flash'){settings.model=DEFAULT_MODEL;save(LS_SET,settings)} // 예전 기본값 자동 교체
applyTheme();

function persist(){save(LS_RECIPES,recipes)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function sampleRecipe(){
  return {id:'sample',url:'',platform:'none',videoId:'',title:'김치볶음밥 (예시)',author:'',
    summary:'앱 사용법을 보여주는 예시 레시피예요. 둘러본 뒤 삭제하세요.',servings:2,time:'15분',difficulty:'쉬움',
    ingredients:[{group:'주재료',name:'밥',amount:'2공기'},{group:'주재료',name:'잘 익은 김치',amount:'1컵'},{group:'주재료',name:'대파',amount:'1/2대'},{group:'주재료',name:'달걀',amount:'2개'},
      {group:'양념',name:'고추장',amount:'1큰술'},{group:'양념',name:'설탕',amount:'0.5큰술'},{group:'양념',name:'참기름',amount:'1큰술'}],
    steps:[{text:'대파를 송송 썰어 기름에 볶아 파기름을 낸다.',t:null},{text:'잘게 썬 김치를 넣고 3분 정도 볶는다.',t:null},{text:'고추장과 설탕을 넣고 볶다가 밥을 넣어 고루 섞는다.',t:null},{text:'불을 끄고 참기름을 두른다. 달걀프라이를 올려 마무리.',t:null}],
    tips:['김치가 덜 익었다면 식초를 몇 방울 넣으면 신맛이 살아나요.'],tags:['예시','밥'],memo:'',fav:false,source:'manual',createdAt:Date.now()};
}

/* ───────── 링크 해석 ───────── */
function parseUrl(raw){
  const s=(raw||'').trim(); if(!s) return null;
  let u; try{u=new URL(/^https?:\/\//i.test(s)?s:'https://'+s)}catch(e){return null}
  const h=u.hostname.replace(/^www\.|^m\./,'');
  let m;
  if(h==='youtu.be'){const id=u.pathname.slice(1).split('/')[0];if(id)return {platform:'youtube',videoId:id,shorts:false,url:'https://www.youtube.com/watch?v='+id}}
  if(h.endsWith('youtube.com')){
    let id=u.searchParams.get('v'), shorts=false;
    if(!id&&(m=u.pathname.match(/^\/(shorts|embed|live|v)\/([\w-]{6,})/))){id=m[2];shorts=m[1]==='shorts'}
    if(id) return {platform:'youtube',videoId:id,shorts,url:shorts?'https://www.youtube.com/shorts/'+id:'https://www.youtube.com/watch?v='+id};
  }
  if(h.endsWith('instagram.com')&&(m=u.pathname.match(/^\/(?:[\w.]+\/)?(p|reel|reels|tv)\/([\w-]+)/))){
    const kind=m[1]==='reels'?'reel':m[1];return {platform:'instagram',videoId:m[2],kind,url:'https://www.instagram.com/'+kind+'/'+m[2]+'/'};
  }
  if(h.endsWith('tiktok.com')){
    if((m=u.pathname.match(/\/video\/(\d+)/))) return {platform:'tiktok',videoId:m[1],url:u.origin+u.pathname};
    return {platform:'tiktok',videoId:'',url:s};
  }
  return {platform:'web',videoId:'',url:u.href};
}

/* ───────── AI 분석 (Gemini) ───────── */
const PROMPT=`너는 요리 영상에서 레시피를 정리하는 도우미야. 주어진 요리 영상(또는 게시물 설명)을 보고 레시피를 한국어로 정리해.
- 영상 속 자막, 말, 화면에 나오는 계량을 최대한 그대로 반영해. 계량이 안 나오면 영상에서 보이는 양을 근거로 추정하되 amount 끝에 "(추정)"을 붙여.
- 재료는 주재료/양념/소스처럼 영상에서 구분되면 group으로 묶어. 구분이 없으면 group은 "재료".
- 조리 순서는 실제로 따라 할 수 있게 구체적으로, 한 단계에 한 동작 위주로. 불 세기와 시간이 나오면 꼭 적어.
- 영상이면 각 단계가 시작되는 시점을 초 단위 숫자로 t에 넣어. 모르면 null.
- 요리 영상이 아니거나 레시피를 알 수 없으면 notRecipe를 true로.
아래 JSON 형식으로만 답해:
{"notRecipe":false,"title":"요리 이름","author":"채널/작성자(알면)","summary":"한두 문장 소개","servings":2,"time":"20분","difficulty":"쉬움|보통|어려움",
"ingredients":[{"group":"주재료","name":"돼지고기 앞다리살","amount":"300g"}],
"steps":[{"text":"...","t":35}],"tips":["..."],"tags":["한식","돼지고기"]}`;

async function analyze({link,caption,file,images=[]}){
  if(!settings.apiKey) throw new Error('NO_KEY');
  const parts=[];
  let useSearch=false;
  images.forEach(img=>parts.push({inlineData:{mimeType:'image/jpeg',data:img.b64}}));
  if(images.length){
    // 레시피 캡처 사진이 있으면 그것만으로 충분. 유튜브 링크면 영상도 같이 봄
    if(!file&&link&&link.platform==='youtube') parts.push({fileData:{fileUri:'https://www.youtube.com/watch?v='+link.videoId}});
  }
  if(file){
    if(file.size>18*1024*1024) throw new Error('영상 파일이 18MB보다 커요. 짧게 자르거나 화질을 낮춰 주세요.');
    parts.push({inlineData:{mimeType:file.type||'video/mp4',data:await toBase64(file)}});
  }else if(link&&link.platform==='youtube'){
    if(!images.length) parts.push({fileData:{fileUri:'https://www.youtube.com/watch?v='+link.videoId}});
  }else if(link&&!caption&&!images.length){
    useSearch=true; // 인스타·틱톡 등은 영상 직접 분석이 안 되어 게시물 페이지 읽기 + 검색으로 보완
  }
  let text=PROMPT;
  if(link) text+='\n\n원본 링크: '+link.url;
  if(caption) text+='\n\n게시물 설명/캡션:\n'+caption;
  if(images.length) text+='\n\n첨부한 사진 '+images.length+'장은 레시피(게시물 설명란 등)를 캡처한 화면이야. 여러 장이면 위에서부터 이어지는 내용이야. 사진 속 글자를 빠짐없이 정확히 읽어서 정리해. 사진에 계량이 적혀 있으면 그대로 쓰고 "(추정)"을 붙이지 마. 앱 화면의 버튼, 댓글, 좋아요 수 같은 건 무시해.';
  if(useSearch){
    const page=link.platform==='instagram'&&link.videoId?'https://www.instagram.com/'+(link.kind||'p')+'/'+link.videoId+'/embed/captioned/':link.url;
    text+='\n\n이 링크의 영상은 직접 볼 수 없어. 먼저 이 게시물 페이지를 열어 작성자가 쓴 설명(캡션)에서 재료와 만드는 법을 읽어: '+page+
      '\n캡션에 레시피가 부족하면 구글 검색으로 같은 작성자의 같은 레시피를 찾아 보충해. 그래도 찾지 못하면 notRecipe를 true로 해.';
  }
  parts.push({text});

  const body={contents:[{role:'user',parts}],generationConfig:{temperature:0.3}};
  if(useSearch) body.tools=[{url_context:{}},{google_search:{}}];
  else body.generationConfig.responseMimeType='application/json';
  // 영상을 저화질로 보게 해서 사용량을 약 1/3로 줄임(레시피 읽기엔 충분)
  // 사진이 있으면 글자를 읽어야 하니 저화질로 낮추지 않음
  if(!images.length&&parts.some(p=>p.fileData||p.inlineData)) body.generationConfig.mediaResolution='MEDIA_RESOLUTION_LOW';

  // 모델이 없거나(404) 그 모델의 무료 한도가 찼으면(429) 다음 후보 모델로 넘어감. 한도는 모델마다 따로라서.
  const tries=[settings.model,...MODEL_FALLBACKS.filter(m=>m!==settings.model)];
  let res,j,out='',all404=true;
  for(const model of tries){
    const call=async()=>{
      // 답을 조금씩 받는 방식(스트리밍): 오래 걸려도 데이터가 계속 오니 아이폰 사파리가 연결을 끊지 않음
      let r;
      for(let n=0;;n++){
        try{
          r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`,{
            method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':settings.apiKey},body:JSON.stringify(body)});
          break;
        }catch(e){if(n>=1||document.hidden) throw new Error('NET');await new Promise(z=>setTimeout(z,1500))}
      }
      if(!r.ok) return {status:r.status,ok:false,j:await r.json().catch(()=>({})),text:''};
      let text='',buf='',err=null;
      const rd=r.body.getReader(),dec=new TextDecoder();
      try{
        for(;;){
          const {value,done}=await rd.read(); if(done) break;
          buf+=dec.decode(value,{stream:true});
          let i;while((i=buf.indexOf('\n'))>=0){
            const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
            if(!line.startsWith('data:')) continue;
            try{const d=JSON.parse(line.slice(5));if(d.error)err=d.error;
              ((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).forEach(p=>{if(p.text&&!p.thought)text+=p.text})}catch(e){}
          }
        }
      }catch(e){throw new Error('NET')}
      if(err) return {status:err.code||500,ok:false,j:{error:err},text:''};
      return {status:200,ok:true,j:{},text};
    };
    const run=async()=>{const c=await call();res=c;j=c.j;out=c.text};
    await run();
    // 구글 서버가 바쁘면(503/500) 잠깐 쉬었다가 같은 모델로 한 번 더
    for(let k=0;k<2&&(res.status===503||res.status===500);k++){
      await new Promise(r=>setTimeout(r,2000*(k+1))); await run();
    }
    if(res.status===400&&body.generationConfig.mediaResolution&&/media_?resolution/i.test(JSON.stringify(j))){
      delete body.generationConfig.mediaResolution; await run();
    }
    if(res.status!==404) all404=false;
    if(res.ok){if(all404&&model!==settings.model){settings.model=model;save(LS_SET,settings)}break}
    if(![404,429,500,503].includes(res.status)) break; // 그래도 바쁘면 다른 모델로
  }
  if(!res.ok){
    const msg=(j.error&&j.error.message)||res.statusText;
    if(res.status===400&&/API key/i.test(msg)) throw new Error('API 키가 올바르지 않아요. 설정에서 키를 다시 확인해 주세요.');
    if(res.status===429) throw new Error('구글 무료 사용량 한도에 걸렸어요. 1분쯤 뒤에 다시 해 보고, 계속 이러면 오늘 무료 한도를 다 쓴 거라 내일 다시 되거나 AI Studio에서 결제를 연결하면 바로 풀려요.');
    if(res.status===404) throw new Error('쓸 수 있는 Gemini 모델을 찾지 못했어요. AI Studio에서 최신 Flash 모델 이름을 확인해 설정에 넣어 주세요.');
    if(res.status===503||res.status===500) throw new Error('구글 AI 서버가 지금 너무 바빠요. 1~2분 뒤에 다시 눌러 주세요. (넣은 사진과 링크는 그대로 있어요)');
    throw new Error('분석 실패 ('+res.status+'): '+msg);
  }
  const data=extractJson(out);
  if(!data) throw new Error('AI 답변을 레시피로 바꾸지 못했어요. 다시 시도하거나 설명을 붙여넣어 주세요.');
  if(data.notRecipe) throw new Error(useSearch?'이 게시물에서 레시피를 읽어 오지 못했어요. 게시물 설명(캡션)을 복사해 붙여넣거나, 영상을 저장해 파일로 올려 주세요.':'레시피를 찾지 못했어요. 요리 영상이 맞는지 확인해 주세요.');
  return data;
}
function extractJson(s){
  if(!s) return null;
  const fence=s.match(/```(?:json)?\s*([\s\S]*?)```/); if(fence) s=fence[1];
  const a=s.indexOf('{'),b=s.lastIndexOf('}'); if(a<0||b<a) return null;
  try{return JSON.parse(s.slice(a,b+1))}catch(e){return null}
}
/* 사진을 줄여서 보냄: 분석용(긴 변 1600px)과 카드 썸네일용(400px) */
function loadImage(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{ok(im);setTimeout(()=>URL.revokeObjectURL(u),0)};im.onerror=()=>no(new Error('사진을 열지 못했어요'));im.src=u})}
function drawJpeg(im,max,q){const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
  c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
async function prepImage(file){const im=await loadImage(file);return {b64:drawJpeg(im,1600,.85).split(',')[1],thumb:drawJpeg(im,400,.7)}}
function toBase64(file){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(',')[1]);fr.onerror=()=>no(new Error('파일을 읽지 못했어요'));fr.readAsDataURL(file)})}

function normalize(d){
  const arr=x=>Array.isArray(x)?x:[];
  return {
    title:String(d.title||'제목 없는 레시피'),author:String(d.author||''),summary:String(d.summary||''),
    servings:Number(d.servings)||null,time:String(d.time||''),difficulty:String(d.difficulty||''),
    ingredients:arr(d.ingredients).map(i=>({group:String(i.group||'재료'),name:String(i.name||''),amount:String(i.amount||'')})).filter(i=>i.name),
    steps:arr(d.steps).map(s=>typeof s==='string'?{text:s,t:null}:{text:String(s.text||''),t:Number.isFinite(+s.t)&&s.t!==null&&s.t!==''?+s.t:null}).filter(s=>s.text),
    tips:arr(d.tips).map(String).filter(Boolean),tags:arr(d.tags).map(String).filter(Boolean).slice(0,6)
  };
}

function scaleAmount(a,f){
  if(f===1||!a) return a;
  return a.replace(/^(\d+)\s*\/\s*(\d+)|^(\d+(?:\.\d+)?)/,(m,n,d,x)=>{
    const v=(n?+n/+d:+x)*f; return fmt(v);
  });
}
function fmt(v){
  const fr=[[.25,'1/4'],[.5,'1/2'],[.75,'3/4'],[1/3,'1/3'],[2/3,'2/3']];
  const w=Math.floor(v),r=v-w;
  for(const [x,s] of fr) if(Math.abs(r-x)<.04) return (w?w+' ':'')+s;
  return String(Math.round(v*10)/10);
}

    for(const f of files){try{addState.images.push(await prepImage(f))}catch(err){toast(err.message)}}
    addState.err='';renderAdd();
  };

    addState.raw=m[0];

    const l=parseUrl(m[0]);

/* 분석 중 화면 꺼짐 방지(지원하는 기기만) */
let wake=null;
async function keepAwake(){try{wake=await navigator.wakeLock.request('screen')}catch(e){wake=null}}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
function errText(e){
  const m=e&&e.message||'';
  if(m==='NET'||/Load failed|Failed to fetch|NetworkError|network connection/i.test(m))
    return '분석 중에 연결이 끊겼어요. 인터넷이 잘 되는지 확인하고, 분석하는 동안에는 다른 앱으로 넘어가지 말고 이 화면을 켜 둔 채 기다려 주세요. 다시 누르면 넣은 사진과 링크 그대로 다시 시작해요.';
  return m;
}
function baseRecipe(link){
  return {id:uid(),url:link?link.url:'',platform:link?link.platform:'none',videoId:link?link.videoId:'',shorts:!!(link&&link.shorts),kind:link&&link.kind||'',
    title:'',author:'',summary:'',servings:null,time:'',difficulty:'',ingredients:[],steps:[],tips:[],tags:[],memo:'',fav:false,source:'ai',createdAt:Date.now()};
}
async function runAnalyze(){
  const link=parseUrl(addState.raw);
  if(!settings.apiKey){addState.err='AI 분석을 쓰려면 먼저 <b>설정</b>에서 Gemini API 키를 넣어 주세요. <a href="#" id="toSet">설정 열기</a>';renderAdd();
    document.getElementById('toSet').onclick=e=>{e.preventDefault();go({name:'settings'})};return}
  if(link){const dup=recipes.find(r=>r.url&&r.url===link.url);if(dup){toast('이미 저장된 레시피예요');go({name:'detail',id:dup.id});return}}
  addState.busy=true;addState.err='';renderAdd();
  keepAwake();
  try{
    const [d,meta]=await Promise.all([analyze({link,caption:addState.caption.trim(),file:addState.file,images:addState.images}),link&&link.platform!=='web'?fetchTitle(link):null]);
    const r=Object.assign(baseRecipe(link),normalize(d));
    if(addState.images.length) r.thumb=addState.images[0].thumb;
    if(meta&&!r.author) r.author=meta.author;
    r.videoTitle=meta?meta.title:'';
    recipes.unshift(r);persist();
    addState=emptyAdd();
    toast('레시피를 저장했어요');
    view={name:'detail',id:r.id};hRep({v:view});render();window.scrollTo(0,0);
  }catch(e){
    addState.busy=false;
    addState.err=e.message==='NO_KEY'?'설정에서 API 키를 넣어 주세요.':esc(errText(e));
    renderAdd();
  }finally{releaseWake()}
}

function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
function mmss(t){t=Math.max(0,Math.floor(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}

/* 수정 폼: 재료는 "이름 | 양", "# 그룹" 줄로 묶음 / 순서는 줄마다 하나, 앞에 [1:23] 붙이면 영상 시점 */
function ingToText(list){let g=null,out=[];list.forEach(i=>{if(i.group!==g){g=i.group;out.push('# '+g)}out.push(i.name+(i.amount?' | '+i.amount:''))});return out.join('\n')}
function textToIng(s){let g='재료';return s.split('\n').map(l=>l.trim()).filter(Boolean).flatMap(l=>{if(l.startsWith('#')){g=l.replace(/^#+\s*/,'')||'재료';return[]}const [n,...a]=l.split('|');return [{group:g,name:n.trim(),amount:a.join('|').trim()}]})}
function stepsToText(list){return list.map(s=>(s.t!=null?'['+mmss(s.t)+'] ':'')+s.text).join('\n')}
function textToSteps(s){return s.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^\[(\d+):(\d{1,2})\]\s*/);return m?{text:l.slice(m[0].length),t:+m[1]*60+ +m[2]}:{text:l.replace(/^\d+[.)]\s*/,''),t:null}})}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* 폰의 "공유하기 → 레시피북"(또는 ?url=...)으로 열리면 바로 분석 시작 */
(function(){
  const p=new URLSearchParams(location.search);
  const shared=[p.get('url'),p.get('text'),p.get('title')].filter(Boolean).join(' ');
  const m=shared.match(/https?:\/\/[^\s"'<>]+/);
  if(m){
    addState.raw=m[0];
    // 공유 글에 링크 말고 긴 설명이 같이 왔으면 캡션으로 사용
    const rest=shared.replace(m[0],'').trim();
    if(rest.length>60) addState.caption=rest;
    hRep({v:{name:'list'}},location.pathname);go({name:'add'});
    if(settings.apiKey) runAnalyze();
  }
  else render();
})();

/* 새 버전 자동 반영: 열 때마다 서버의 최신 파일을 받아 버전이 다르면 한 번 새로고침.
   cache:'reload'로 받으면 브라우저 저장본도 새 파일로 바뀌어서 다음 로드부터 새 버전이 나옴 */
(async function(){
  if(!/^https?:$/.test(location.protocol)) return;
  const mine=document.querySelector('meta[name="app-version"]').content;
  try{
    const t=await (await fetch(location.pathname,{cache:'reload'})).text();
    const m=t.match(/name="app-version" content="([^"]+)"/);
    if(!m||m[1]===mine) return;
    let tried='';try{tried=sessionStorage.getItem('rb-upd')||''}catch(e){}
    if(tried===m[1]) return; // 이미 한 번 새로고침했는데도 그대로면 반복하지 않음
    try{sessionStorage.setItem('rb-upd',m[1])}catch(e){}
    if(view.name==='list'||view.name==='detail'||(view.name==='add'&&!hasInput())) location.reload();
    else toast('새 버전이 있어요. 지금 작업을 마친 뒤 앱을 다시 열면 반영돼요');
  }catch(e){}
})();
</script>
